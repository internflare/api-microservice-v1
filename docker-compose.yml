services:
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence keeps data across container restarts.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis-data:/data

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "3000"
      AUTH_SERVICE_URL: http://auth-service:3001
      NOTIFICATION_SERVICE_URL: http://notification-service:3002
      JOB_LISTING_SERVICE_URL: http://joblisting-service:3003
      PROFILE_SERVICE_URL: http://profile-service:3004
      AI_SERVICE_URL: http://ai-service:3005
    depends_on:
      auth-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      joblisting-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    restart: unless-stopped
    dns: [8.8.8.8, 1.1.1.1]
    env_file:
      - ./auth-service/.env
    environment:
      NODE_ENV: development
      PORT: "3001"
      RABBITMQ_URL: amqp://rabbitmq:5672
      PROFILE_SERVICE_URL: http://profile-service:3004
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    restart: unless-stopped
    dns: [8.8.8.8, 1.1.1.1]
    env_file:
      - ./notification-service/.env
    environment:
      NODE_ENV: development
      PORT: "3002"
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "3002:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  joblisting-service:
    build:
      context: .
      dockerfile: jobListing-service/Dockerfile
    restart: unless-stopped
    dns: [8.8.8.8, 1.1.1.1]
    env_file:
      - ./jobListing-service/.env
    environment:
      NODE_ENV: development
      PORT: "3003"
      RABBITMQ_URL: amqp://rabbitmq:5672
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:3001
      PROFILE_SERVICE_URL: http://profile-service:3004
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-internflare-internal-microservice-secret-key-32chars}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
    ports:
      - "3003:3003"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  profile-service:
    build:
      context: .
      dockerfile: profile-service/Dockerfile
    restart: unless-stopped
    dns: [8.8.8.8, 1.1.1.1]
    env_file:
      - ./profile-service/.env
    environment:
      NODE_ENV: development
      PORT: "3004"
      RABBITMQ_URL: amqp://rabbitmq:5672
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:3001
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-internflare-internal-microservice-secret-key-32chars}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "3004:3004"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    restart: unless-stopped
    dns: [8.8.8.8, 1.1.1.1]
    # MONGODB_URI is shared with profile-service; ai-service/.env overrides on conflict.
    env_file:
      - ./profile-service/.env
      - ./ai-service/.env
    environment:
      NODE_ENV: development
      PORT: "3005"
      RABBITMQ_URL: amqp://rabbitmq:5672
      AUTH_SERVICE_URL: http://auth-service:3001
      PROFILE_SERVICE_URL: http://profile-service:3004
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
    ports:
      - "3005:3005"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  rabbitmq-data:
  redis-data:
