services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 90s

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "3000"
      AUTH_SERVICE_URL: http://auth-service:3001
      NOTIFICATION_SERVICE_URL: http://notification-service:3002
      JOB_LISTING_SERVICE_URL: http://joblisting-service:3003
      COMPANY_SERVICE_URL: http://company-service:3004
      TALENT_SERVICE_URL: http://talent-service:3005
    depends_on:
      auth-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      joblisting-service:
        condition: service_healthy
      company-service:
        condition: service_healthy
      talent-service:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ./auth-service/.env
    environment:
      NODE_ENV: development
      PORT: "3001"
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ./notification-service/.env
    environment:
      NODE_ENV: development
      PORT: "3002"
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "3002:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  joblisting-service:
    build:
      context: .
      dockerfile: jobListing-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ./jobListing-service/.env
    environment:
      NODE_ENV: development
      PORT: "3003"
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "3003:3003"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  company-service:
    build:
      context: .
      dockerfile: company-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ./company-service/.env
    environment:
      NODE_ENV: development
      PORT: "3004"
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      auth-service:
        condition: service_healthy
    ports:
      - "3004:3004"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3004/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  talent-service:
    build:
      context: .
      dockerfile: talent-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ./talent-service/.env
    environment:
      NODE_ENV: development
      PORT: "3005"
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      auth-service:
        condition: service_healthy
    ports:
      - "3005:3005"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3005/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  rabbitmq-data:
